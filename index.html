<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sophia Systems</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#020611;
  color:white;
}

/* HEADER */
.header {
  position:fixed;
  top:0;
  width:100%;
  background:#050c1d;
  padding:15px;
  z-index:10;
}

.logo {
  height:60px;
}

/* KPI STRIP */
.metrics {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:10px;
}

.metric {
  background:#0a152d;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.metric h3 {
  margin:5px 0;
}

/* TABLE */
.content {
  margin-top:160px;
  padding:20px;
}

table {
  width:100%;
  border-collapse:collapse;
}

td,th {
  padding:10px;
  border-bottom:1px solid #222;
}

tr:hover {
  background:#0a1a30;
  cursor:pointer;
}

/* PANEL */
.panel {
  position:fixed;
  right:-400px;
  top:0;
  width:400px;
  height:100%;
  background:#0a152d;
  padding:20px;
  transition:.3s;
}

.panel.open {
  right:0;
}
</style>
</head>

<body>

<div class="header">
  <img src="/logo-header.png" class="logo">

  <div class="metrics">
    <div class="metric"><h3 id="ready">0</h3>Ready</div>
    <div class="metric"><h3 id="partial">0</h3>Partial</div>
    <div class="metric"><h3 id="service">0</h3>Service</div>
    <div class="metric"><h3 id="existing">0</h3>Existing</div>
    <div class="metric"><h3 id="incomplete">0</h3>Incomplete</div>
  </div>
</div>

<div class="content">
<table id="table"></table>
</div>

<div id="panel" class="panel"></div>

<script>
const supabase = window.supabase.createClient(
  "https://aeonjnohadmbxfuoirqa.supabase.co",
  "sb_publishable_Hua7OwdofLmGXgTapILwBA_XHnbyyxf"
);

let data = [];

async function load() {
  let res = await supabase.from("leads").select("*");
  data = res.data;
  render();
}

function render() {
  let ready=0,partial=0,service=0,existing=0,incomplete=0;

  data.forEach(r=>{
    if(r.quote_readiness==="ready") ready++;
    else if(r.existing_order_request) existing++;
    else if(r.delivery_change_request || r.delivery_alert_request) service++;
    else if(r.missing_information && r.missing_information!=="none") incomplete++;
    else partial++;
  });

  document.getElementById("ready").innerText=ready;
  document.getElementById("partial").innerText=partial;
  document.getElementById("service").innerText=service;
  document.getElementById("existing").innerText=existing;
  document.getElementById("incomplete").innerText=incomplete;

  let html="<tr><th>Name</th><th>Phone</th><th>Products</th><th>Assign</th><th>Done</th></tr>";

  data.forEach(r=>{
    html+=`
    <tr onclick='openPanel(${JSON.stringify(r)})'>
      <td>${r.full_name||""}</td>
      <td>${r.phone||""}</td>
      <td>${r.products_requested||""}</td>
      <td>
        <button onclick="assign(event,'${r.id}','Carina')">Carina</button>
        <button onclick="assign(event,'${r.id}','James')">James</button>
      </td>
      <td>
        <button onclick="done(event,'${r.id}')">Done</button>
      </td>
    </tr>`;
  });

  document.getElementById("table").innerHTML=html;
}

function openPanel(r) {
  let p=document.getElementById("panel");
  p.classList.add("open");

  p.innerHTML=`
  <h2>${r.full_name}</h2>
  <p>${r.phone}</p>

  <label>Quote</label>
  <input id="q" value="${r.quote_number||""}">

  <label>Order</label>
  <input id="o" value="${r.order_number||""}">

  <button onclick="save('${r.id}')">Save</button>
  `;
}

async function save(id){
  let q=document.getElementById("q").value;
  let o=document.getElementById("o").value;

  await supabase.from("leads").update({
    quote_number:q,
    order_number:o
  }).eq("id",id);

  load();
}

async function assign(e,id,name){
  e.stopPropagation();
  await supabase.from("leads").update({assigned_to:name}).eq("id",id);
  load();
}

async function done(e,id){
  e.stopPropagation();
  await supabase.from("leads").update({
    follow_up_status:true
  }).eq("id",id);
  load();
}

load();
</script>

</body>
</html>
