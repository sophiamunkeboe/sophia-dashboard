<!DOCTYPE html>
<html>
<head>
  <title>Sophia Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #0a0f2c, #020617);
      color: white;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: 32px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      padding: 20px;
      border-radius: 15px;
      background: rgba(0, 150, 255, 0.1);
      border: 1px solid rgba(0,255,255,0.2);
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
    }

    .card h2 {
      margin: 0;
      font-size: 14px;
      color: #aaa;
    }

    .card p {
      font-size: 28px;
      margin: 10px 0 0;
    }

    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    th {
      text-align: left;
      color: #aaa;
    }

    .status {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .ready { background: #00ffcc33; }
    .partial { background: #ffaa0033; }
    .incomplete { background: #ff444433; }

  </style>
</head>

<body>

<div class="container">

  <h1>🧠 Sophia Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h2>Calls Today</h2>
      <p>25</p>
    </div>

    <div class="card">
      <h2>Ready Quotes</h2>
      <p>9</p>
    </div>

    <div class="card">
      <h2>Service Calls</h2>
      <p>7</p>
    </div>

    <div class="card">
      <h2>Incomplete</h2>
      <p>3</p>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Event Date</th>
        <th>Products</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Corinne Harmon</td>
        <td>4068362832</td>
        <td>May 16</td>
        <td>Tables + Chairs</td>
        <td><span class="status ready">READY</span></td>
      </tr>

      <tr>
        <td>Laura Connolly</td>
        <td>4802413350</td>
        <td>May 18</td>
        <td>Linens</td>
        <td><span class="status partial">PARTIAL</span></td>
      </tr>

      <tr>
        <td>Unknown</td>
        <td>6025855859</td>
        <td>May 20</td>
        <td>Unknown</td>
        <td><span class="status incomplete">INCOMPLETE</span></td>
      </tr>
    </tbody>

  </table>

</div>

</body>
</html>
