<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sophia Systems Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0a0f2a, #02040a);
    color: white;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    padding: 20px 30px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo img {
    height: 50px;
    filter: drop-shadow(0 0 10px #00eaff);
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-text h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 2px;
}

.logo-text span {
    font-size: 12px;
    opacity: 0.7;
}

/* CARDS */
.cards {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.card {
    flex: 1;
    padding: 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 15px rgba(0,255,255,0.1);
    backdrop-filter: blur(10px);
}

/* TABLE */
.table {
    margin: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 20px;
}

.row {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: 0.2s;
}

.row:hover {
    background: rgba(0,255,255,0.08);
}

/* BUTTONS */
button {
    background: linear-gradient(45deg, #00eaff, #0077ff);
    border: none;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,255,255,0.5);
}

button:hover {
    transform: scale(1.05);
}

/* STATUS */
.status {
    padding: 5px 10px;
    border-radius: 10px;
}

.ready { background: rgba(0,255,100,0.2); }
.incomplete { background: rgba(255,0,0,0.2); }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">
        <img src="https://i.imgur.com/your-logo.png">
        <div class="logo-text">
            <h1>SOPHIA SYSTEMS</h1>
            <span>Capture every call. Convert every opportunity.</span>
        </div>
    </div>
</div>

<!-- CARDS -->
<div class="cards">
    <div class="card">Calls Today: <span id="calls">0</span></div>
    <div class="card">Ready Quotes: <span id="ready">0</span></div>
    <div class="card">Service: <span id="service">0</span></div>
    <div class="card">Incomplete: <span id="incomplete">0</span></div>
</div>

<!-- TABLE -->
<div class="table" id="table"></div>

<script>
const supabase = window.supabase.createClient(
  "https://aeonjnohadmbxfuoirqa.supabase.co",
  "sb_publishable_Hua7OwdofLmGXgTapILwBA_XHnbyyxf"
);

async function loadData() {
    let { data } = await supabase.from("leads").select("*");

    document.getElementById("calls").innerText = data.length;
    document.getElementById("ready").innerText = data.filter(x => x.status === "ready").length;
    document.getElementById("incomplete").innerText = data.filter(x => x.status === "incomplete").length;

    let html = "";

    data.forEach(d => {
        html += `
        <div class="row">
            <div>${d.full_name}</div>
            <div>${d.phone}</div>
            <div>${d.event_date}</div>
            <div>${d.products_requested}</div>
            <div>${d.workflow_route}</div>
            <div class="status ${d.status}">${d.status}</div>
            <div>${d.assigned_to || "-"}</div>
            <div>
                <button onclick="assign('${d.id}','Carina')">Carina</button>
                <button onclick="assign('${d.id}','James')">James</button>
                <button onclick="assign('${d.id}','Linda')">Linda</button>
            </div>
        </div>
        `;
    });

    document.getElementById("table").innerHTML = html;
}

async function assign(id, name) {
    await supabase.from("leads").update({ assigned_to: name }).eq("id", id);
    loadData();
}

loadData();
</script>

</body>
</html>
