<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sophia Systems Dashboard</title>

<style>
body {
margin: 0;
font-family: 'Segoe UI', sans-serif;
background: radial-gradient(circle at center, #020617 0%, #000 100%);
color: white;
overflow: hidden;
}

/* BACKGROUND LOGO (FADED + FIXED) */
body::before {
content: "";
position: fixed;
top: 50%;
left: 50%;
width: 900px;
height: 900px;
background: url("images/logo-bg.png") no-repeat center;
background-size: contain;
opacity: 0.05;
transform: translate(-50%, -50%);
pointer-events: none;
}

/* HEADER */
.header {
display: flex;
align-items: center;
padding: 20px;
border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo {
height: 55px;
margin-right: 15px;
}

.title {
font-size: 22px;
font-weight: 600;
}

.subtitle {
font-size: 12px;
opacity: 0.6;
}

/* DASHBOARD GRID */
.grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 15px;
padding: 20px;
}

/* GLOW CARDS */
.card {
background: rgba(255,255,255,0.03);
border-radius: 12px;
padding: 20px;
box-shadow: 0 0 15px rgba(0,255,255,0.1);
transition: 0.3s;
}

.card:hover {
transform: translateY(-4px);
box-shadow: 0 0 25px rgba(0,255,255,0.4);
}

/* LEADS TABLE */
.table-container {
padding: 20px;
height: calc(100vh - 180px);
overflow-y: auto;
}

table {
width: 100%;
border-collapse: collapse;
}

th, td {
padding: 12px;
text-align: left;
}

th {
opacity: 0.6;
}

tr {
border-bottom: 1px solid rgba(255,255,255,0.05);
}

/* STATUS TAGS */
.status {
padding: 6px 12px;
border-radius: 20px;
font-size: 12px;
}

.ready { background: rgba(0,255,100,0.2); }
.incomplete { background: rgba(255,0,0,0.2); }
.pending { background: rgba(255,200,0,0.2); }

/* BUTTONS */
button {
background: rgba(0,255,255,0.1);
border: 1px solid rgba(0,255,255,0.3);
color: white;
padding: 6px 12px;
border-radius: 8px;
cursor: pointer;
transition: 0.2s;
}

button:hover {
box-shadow: 0 0 12px cyan;
}

/* SLIDE PANEL */
.panel {
position: fixed;
right: -400px;
top: 0;
width: 400px;
height: 100%;
background: #020617;
box-shadow: -5px 0 20px rgba(0,255,255,0.2);
padding: 20px;
transition: 0.4s;
}

.panel.open {
right: 0;
}

/* AUDIO */
audio {
display: none;
}

</style>
</head>

<body>

<!-- SOUNDS -->
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3"></audio>
<audio id="panelSound" src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-door-901.mp3"></audio>

<!-- HEADER -->
<div class="header">
<img src="images/logo-header.png" class="logo">
<div>
<div class="title">Sophia Systems</div>
<div class="subtitle">Capture every call. Convert every opportunity.</div>
</div>
</div>

<!-- METRICS -->
<div class="grid">
<div class="card">Calls Today<br><h2 id="calls">0</h2></div>
<div class="card">Ready Quotes<br><h2 id="ready">0</h2></div>
<div class="card">Service Calls<br><h2 id="service">0</h2></div>
<div class="card">Incomplete<br><h2 id="incomplete">0</h2></div>
</div>

<!-- TABLE -->
<div class="table-container">
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Status</th>
<th>Assigned</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<!-- SLIDE PANEL -->
<div class="panel" id="panel">
<h2>Client Details</h2>
<div id="panelContent"></div>
</div>

<script>

const clickSound = document.getElementById("clickSound");
const panelSound = document.getElementById("panelSound");

function playClick(){ clickSound.play(); }
function openPanel(data){
panelSound.play();
document.getElementById("panel").classList.add("open");
document.getElementById("panelContent").innerHTML = `
<p><b>Name:</b> ${data.full_name}</p>
<p><b>Phone:</b> ${data.phone}</p>
<p><b>Products:</b> ${data.products_requested}</p>
<p><b>Notes:</b> ${data.notes}</p>
<p><b>Quote #:</b> <input placeholder="Enter Quote"></p>
<p><b>Order #:</b> <input placeholder="Enter Order"></p>
`;
}

function assign(){
playClick();
const name = prompt("Assign to: Carina, James, or Linda");
return name;
}

async function loadData(){
const res = await fetch("https://aeonjnohadmbxfuoirqa.supabase.co/rest/v1/leads", {
headers: {
"apikey": "sb_publishable_Hua7OwdofLmGXgTapILwBA_XHnbyyxf",
"Authorization": "Bearer sb_publishable_Hua7OwdofLmGXgTapILwBA_XHnbyyxf"
}
});

const data = await res.json();

document.getElementById("calls").innerText = data.length;

let ready=0, incomplete=0;

const table = document.getElementById("tableBody");
table.innerHTML="";

data.forEach(d=>{
if(d.status==="READY") ready++;
if(d.status==="INCOMPLETE") incomplete++;

table.innerHTML += `
<tr onclick='openPanel(${JSON.stringify(d)})'>
<td>${d.full_name}</td>
<td>${d.phone}</td>
<td><span class="status ${d.status.toLowerCase()}">${d.status}</span></td>
<td>${d.assigned || "-"}</td>
<td>
<button onclick="assign()">Assign</button>
<button onclick="playClick()">Done</button>
</td>
</tr>`;
});

document.getElementById("ready").innerText = ready;
document.getElementById("incomplete").innerText = incomplete;
}

loadData();

</script>

</body>
</html>
